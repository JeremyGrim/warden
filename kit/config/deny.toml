# Le contrôle des dépendances Rust : `cargo deny check --config config/deny.toml`, joué par la vérification de poussée
# quand un manifeste ou le verrou change. Les avis de sécurité viennent de la base publique RustSec, téléchargée puis
# comparée sur le poste au verrou : aucune liste de dépendances ne part.

[graph]
all-features = false

[advisories]
# Un crate de l'espace qui dépend directement d'un crate abandonné bloque ; plus loin dans le graphe, il est dit.
unmaintained = "workspace"
yanked = "deny"
# Chaque avis ignoré est une dette nommée, avec sa raison : { id = "RUSTSEC-…", reason = "…" }. Un avis neuf bloque.
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
  "0BSD", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-1-Clause", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0",
  "CC0-1.0", "CDLA-Permissive-2.0", "ISC", "MIT", "MIT-0", "MPL-2.0", "Unicode-3.0", "Unlicense", "Zlib",
]

[licenses.private]
# Les crates de l'espace qui ne se publient pas (`publish = false`).
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
