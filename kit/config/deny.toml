# The Rust dependency check: `cargo deny check --config config/deny.toml`, run by the push verification when a manifest
# or the lockfile changes. Security advisories come from the public RustSec database, downloaded and compared to the
# lockfile on the workstation: no dependency list leaves the workstation.

[graph]
all-features = false

[advisories]
# A workspace crate depending directly on an unmaintained crate blocks; further down the graph, it is reported.
unmaintained = "workspace"
yanked = "deny"
# Each ignored advisory is a named debt, with its reason: { id = "RUSTSEC-…", reason = "…" }. A new advisory blocks.
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
  "0BSD", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-1-Clause", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0",
  "CC0-1.0", "CDLA-Permissive-2.0", "ISC", "MIT", "MIT-0", "MPL-2.0", "Unicode-3.0", "Unlicense", "Zlib",
]

[licenses.private]
# Workspace crates that are not published (`publish = false`).
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
